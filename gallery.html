<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant gallery · Yard Shade Studio</title>
<style>
  body{margin:0;padding:24px;background:#0E1311;color:#ECE7DA;font:13px/1.4 "Helvetica Neue",Arial,sans-serif}
  h1{font:400 30px Georgia,serif;margin:0 0 6px} h2{font:400 21px Georgia,serif;margin:30px 0 10px;border-bottom:1px solid #26302B;padding-bottom:6px}
  h2 span{font:12px "Helvetica Neue",Arial,sans-serif;color:#8A8C80;margin-left:10px}
  p{color:#A6A89A;margin:0 0 14px;max-width:70ch}
  .bar{position:sticky;top:0;background:#0E1311;padding:10px 0;display:flex;gap:8px;z-index:2;flex-wrap:wrap}
  button{background:#1A211E;color:#ECE7DA;border:1px solid #2C3631;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
  button[aria-pressed=true]{background:#D4A85A;color:#1D1606;border-color:#D4A85A}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  figure{margin:0;background:#141A17;border:1px solid #222A26;border-radius:10px;overflow:hidden}
  figure img{display:block;width:100%;aspect-ratio:4/3;background:linear-gradient(#222b30,#161c19)}
  figcaption{padding:8px 10px} figcaption b{display:block;font-weight:500} figcaption i{font-style:normal;color:#8A8C80;font-size:11.5px}
  .big .grid{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
  .tex{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .tex canvas{display:block;width:100%;aspect-ratio:1;background:#20282c}
</style>
</head>
<body>
<h1>Plant gallery</h1>
<p>Every preset in the plant catalogue, rendered from its model. A development page for checking the models; it is not part of the app.</p>
<div class="bar" id="bar"></div>
<div id="host"></div>
<script type="module" src="/src/garden/gallery.js"></script>
</body>
</html>
